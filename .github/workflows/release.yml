name: BRO Release Test Build

on:
  push:
    tags:
      - 'v*'

# Job-level env: all steps can access these values.
env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_R2_MEDIA_URL: ${{ secrets.EXPO_PUBLIC_R2_MEDIA_URL }}
  EXPO_PUBLIC_MEME_UPLOAD_URL: ${{ secrets.EXPO_PUBLIC_MEME_UPLOAD_URL }}
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          set -euo pipefail


          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_URL is not set."
            MISSING=1
          fi

          if [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_ANON_KEY is not set."
            MISSING=1
          fi
          if [ -z "${EXPO_PUBLIC_API_URL:-}" ]; then
            echo "WARN: EXPO_PUBLIC_API_URL is not set. The app will fall back to https://api.bro.app."
          fi

          echo "Secret check passed."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # See android-build.yml: install the pinned NDK up front so Gradle does
      # not fail mid-build on a transient SDK download.
      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' node_modules/react-native/gradle/libs.versions.toml | head -n1)
          if [ -z "$NDK_VERSION" ]; then
            echo "Could not read ndkVersion from React Native's version catalog"
            exit 1
          fi
          echo "Installing NDK $NDK_VERSION"
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" > /dev/null || true
          "$SDKMANAGER" --list_installed | grep -q "ndk;$NDK_VERSION"

      # Generate the native Android project from app.json / package.json.
      # The `android/` directory does not exist before this step, so it must
      # run before any Gradle invocation.
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        timeout-minutes: 30
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_R2_MEDIA_URL: ${{ secrets.EXPO_PUBLIC_R2_MEDIA_URL }}
          EXPO_PUBLIC_MEME_UPLOAD_URL: ${{ secrets.EXPO_PUBLIC_MEME_UPLOAD_URL }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      # F-Droid handles release signing and publishing. This workflow builds a
      # debug APK for testing tagged versions. For production, F-Droid builds
      # from source.
      - name: Build Test APK (Debug)
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_R2_MEDIA_URL: ${{ secrets.EXPO_PUBLIC_R2_MEDIA_URL }}
          EXPO_PUBLIC_MEME_UPLOAD_URL: ${{ secrets.EXPO_PUBLIC_MEME_UPLOAD_URL }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        timeout-minutes: 30

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: BRO-test-debug
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Keep the website's stable download URL pointing at this tagged build,
      # not the last main-branch build. Same stable alias as android-build.yml.
      - name: Push APK to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs found to upload"
            exit 1
          fi
          arm64_url=""
          armeabi_url=""
          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            echo "Uploading $name"
            url=$(node scripts/upload-apk-blob.mjs "$apk")
            echo "  $url"
            if [ "$name" = "app-arm64-v8a-release.apk" ]; then
              echo "Publishing $name as the stable apk/app-release.apk"
              node scripts/upload-apk-blob.mjs "$apk" "apk/app-release.apk"
              arm64_url="$url"
            elif [ "$name" = "app-armeabi-v7a-release.apk" ]; then
              armeabi_url="$url"
            fi
          done
          # Keep the download page's pointer current on tagged releases too.
          node scripts/publish-apk-manifest.mjs "$arm64_url" "$armeabi_url"