name: Validate Secrets

# Lightweight check that required repository secrets exist before CI runs.
# This workflow does NOT read or expose secret values — it only checks
# whether they are configured via GitHub Actions expressions (no API calls).
on:
  pull_request:
    branches: [main, develop]

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check required secrets exist
        run: |
          set -euo pipefail

          echo "=== Checking secrets ==="

          MISSING=0

          if [ "${HAS_CLERK_KEY}" = "true" ]; then
            echo "OK       EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY is set"
          else
            echo "MISSING  EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY (REQUIRED)"
            MISSING=1
          fi

          if [ "${HAS_API_URL}" = "true" ]; then
            echo "OK       EXPO_PUBLIC_API_URL is set"
          else
            echo "NOT SET  EXPO_PUBLIC_API_URL (optional — app will use fallback)"
          fi

          echo ""
          if [ "$MISSING" -ne 0 ]; then
            echo "FATAL: One or more required secrets are missing."
            echo ""
            echo "Configure them before merging this PR:"
            echo ""
            echo "  ./scripts/setup-secrets.sh"
            echo ""
            echo "or via the web UI:"
            echo "  https://github.com/${OWNER}/${REPO}/settings/secrets/actions"
            exit 1
          fi

          echo "All required secrets are configured."
        env:
          OWNER: marvel-254
          REPO: bro
          HAS_CLERK_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}
          HAS_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL != '' }}
