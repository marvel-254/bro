name: Validate Secrets

# Lightweight check that required repository secrets exist before CI runs.
# Uses GitHub Actions expressions (no API calls), so the default GITHUB_TOKEN
# permission scopes do not matter — it only inspects the `secrets` context.
on:
  pull_request:
    branches: [main, develop]

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets exist
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          set -euo pipefail

          MISSING=0

          if [ -n "${SUPABASE_URL:-}" ]; then
            echo "OK       EXPO_PUBLIC_SUPABASE_URL is set"
          else
            echo "MISSING  EXPO_PUBLIC_SUPABASE_URL (REQUIRED)"
            MISSING=1
          fi

          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            echo "OK       EXPO_PUBLIC_SUPABASE_ANON_KEY is set"
          else
            echo "MISSING  EXPO_PUBLIC_SUPABASE_ANON_KEY (REQUIRED)"
            MISSING=1
          fi

          if [ -n "${API_URL:-}" ]; then
            echo "OK       EXPO_PUBLIC_API_URL is set"
          else
            echo "NOT SET  EXPO_PUBLIC_API_URL (optional — app will use fallback)"
          fi

          echo ""

          if [ "$MISSING" -ne 0 ]; then
            echo "FATAL: One or more required secrets are missing."
            echo ""
            echo "Configure them before merging this PR:"
            echo ""
            echo "  gh secret set EXPO_PUBLIC_SUPABASE_URL --repo ${GITHUB_REPOSITORY}"
            echo "  gh secret set EXPO_PUBLIC_SUPABASE_ANON_KEY --repo ${GITHUB_REPOSITORY}"
            echo ""
            echo "or via the web UI:"
            echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            echo ""
            echo "See .github/workflows/secrets-setup.md for full instructions."
            exit 1
          fi

          echo "All required secrets are configured. Proceeding with CI."
