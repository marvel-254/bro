name: Validate Secrets

# Lightweight check that required repository secrets exist before CI runs.
# This workflow does NOT read or expose secret values — it only checks
# whether they are configured on the repository via the GitHub API.
on:
  pull_request:
    branches: [main, develop]

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    # `gh secret view` hits the Actions Secrets API, which requires
    # `actions: read`. The default GITHUB_TOKEN does not have this scope,
    # so grant it explicitly here.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check required secrets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OWNER="bro-app"
          REPO="bro"
          REQUIRED=("EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY")
          OPTIONAL=("EXPO_PUBLIC_API_URL")

          echo "=== Checking secrets on ${OWNER}/${REPO} ==="

          MISSING=0

          for secret in "${REQUIRED[@]}"; do
            if gh secret view "${secret}" --repo "${OWNER}/${REPO}" >/dev/null 2>&1; then
              echo "OK       ${secret} is set"
            else
              echo "MISSING  ${secret} (REQUIRED)"
              MISSING=1
            fi
          done

          for secret in "${OPTIONAL[@]}"; do
            if gh secret view "${secret}" --repo "${OWNER}/${REPO}" >/dev/null 2>&1; then
              echo "OK       ${secret} is set"
            else
              echo "NOT SET  ${secret} (optional — app will use fallback)"
            fi
          done

          echo ""

          if [ "$MISSING" -ne 0 ]; then
            echo "FATAL: One or more required secrets are missing."
            echo ""
            echo "Configure them before merging this PR:"
            echo ""
            echo "  ./scripts/setup-secrets.sh"
            echo ""
            echo "or via the web UI:"
            echo "  https://github.com/${OWNER}/${REPO}/settings/secrets/actions"
            echo ""
            echo "See .github/workflows/secrets-setup.md for full instructions."
            exit 1
          fi

          echo "All required secrets are configured. Proceeding with CI."