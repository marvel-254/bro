name: BRO Debug APK (device debugging)

# Builds a *debug* APK for on-device debugging. Debug APKs do NOT embed the
# JS bundle: they load it from a Metro dev server over `adb reverse`. That
# makes this the tool for diagnosing runtime/JS problems on a real device,
# where a release APK only shows an opaque result.
#
# Usage:
#   adb reverse tcp:8081 tcp:8081
#   npx expo start
#   adb install -r app-debug.apk

on:
  workflow_dispatch:
  push:
    branches:
      - feat/supabase-chat
    paths:
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug.yml'

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_R2_MEDIA_URL: ${{ secrets.EXPO_PUBLIC_R2_MEDIA_URL }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --legacy-peer-deps

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-debug-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-debug-

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BRO-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7