name: BRO Android Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Job-level env: all steps can access these values.
# Secrets are read via the `secrets` context and exposed as environment
# variables to the build. Expo embeds EXPO_PUBLIC_* values at build time.
env:
  EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          set -euo pipefail

          MISSING=0

          if [ -z "${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY is not set."
            echo "Set it at: Settings -> Secrets and variables -> Actions -> Repository secrets"
            echo "See .github/workflows/secrets-setup.md for instructions."
            MISSING=1
          fi

          if [ -z "${EXPO_PUBLIC_API_URL:-}" ]; then
            echo "WARN: EXPO_PUBLIC_API_URL is not set. The app will fall back to https://api.bro.app."
          fi

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "FATAL: Required secrets are missing. Aborting build."
            exit 1
          fi

          echo "Secret check passed."
          echo "EXPO_PUBLIC_API_URL is set: $([ -n "${EXPO_PUBLIC_API_URL:-}" ] && echo yes || echo no)"

      - name: Validate Clerk Publishable Key Format
        run: |
          set -euo pipefail

          KEY="${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}"

          if [ -z "$KEY" ]; then
            echo "ERROR: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY is empty — cannot validate format."
            exit 1
          fi

          case "$KEY" in
            pk_*)
              echo "Clerk publishable key format is valid (starts with 'pk_')."
              ;;
            *)
              echo "ERROR: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY does not start with 'pk_'."
              echo "Clerk publishable keys always begin with 'pk_' (e.g. pk_test_... or pk_live_...)."
              echo "You may have copied the Clerk secret key (sk_...) instead."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --legacy-peer-deps

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cache Gradle artifacts keyed on the wrapper properties + lockfile.
      # The `android/` directory is generated by `expo prebuild` and does not
      # exist before the first build, so the restore-keys fallback is required.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', '**/gradle.lockfile') }}
          restore-keys: |
            gradle-

      # Generate the native Android project from app.json / package.json.
      # `--clean` wipes any stale native config so the build reflects the
      # current Expo config. The `android/` directory is created by this step.
      - name: Prebuild Android
        run: |
          npx expo prebuild --platform android --clean
        timeout-minutes: 30
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Run Tests
        run: npm test -- --passWithNoTests

      # Build the debug APK. Gradle is invoked from the generated `android/`
      # directory. EXPO_PUBLIC_* env vars are inherited from the job-level
      # `env:` block and are embedded into the native build by the Gradle
      # config that `expo prebuild` generated.
      - name: Generate APK
        working-directory: android
        run: ./gradlew assembleDebug
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        timeout-minutes: 30

      - name: Verify APK exists
        run: |
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK not found at expected path"
            find android -name "*.apk" -type f 2>/dev/null
            exit 1
          fi
          echo "APK verified: $(ls -lh android/app/build/outputs/apk/debug/app-debug.apk)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BRO-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7