name: BRO Android Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Job-level env: all steps can access these values.
# Secrets are read via the `secrets` context and exposed as environment
# variables to the build. Expo embeds EXPO_PUBLIC_* values at build time.
env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_R2_MEDIA_URL: ${{ secrets.EXPO_PUBLIC_R2_MEDIA_URL }}
  EXPO_PUBLIC_MEME_UPLOAD_URL: ${{ secrets.EXPO_PUBLIC_MEME_UPLOAD_URL }}
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          set -euo pipefail

          MISSING=0


          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_URL is not set."
            MISSING=1
          fi

          if [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_ANON_KEY is not set."
            MISSING=1
          fi
          if [ -z "${EXPO_PUBLIC_API_URL:-}" ]; then
            echo "WARN: EXPO_PUBLIC_API_URL is not set. The app will fall back to https://api.bro.app."
          fi

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "FATAL: Required secrets are missing. Aborting build."
            exit 1
          fi

          echo "Secret check passed."
          echo "EXPO_PUBLIC_API_URL is set: $([ -n "${EXPO_PUBLIC_API_URL:-}" ] && echo yes || echo no)"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --legacy-peer-deps

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cache Gradle artifacts keyed on the wrapper properties + lockfile.
      # The `android/` directory is generated by `expo prebuild` and does not
      # exist before the first build, so the restore-keys fallback is required.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', '**/gradle.lockfile') }}
          restore-keys: |
            gradle-

      # Generate the native Android project from app.json / package.json.
      # `--clean` wipes any stale native config so the build reflects the
      # current Expo config. The `android/` directory is created by this step.
      - name: Prebuild Android
        run: |
          npx expo prebuild --platform android --clean
        timeout-minutes: 30
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_R2_MEDIA_URL: ${{ secrets.EXPO_PUBLIC_R2_MEDIA_URL }}
          EXPO_PUBLIC_MEME_UPLOAD_URL: ${{ secrets.EXPO_PUBLIC_MEME_UPLOAD_URL }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Run Tests
        run: npm test -- --passWithNoTests

      # Fast gate: prove the production JS bundle actually resolves before
      # spending ~12 min on Gradle. This is the check that catches missing
      # runtime deps and bad import paths -- a debug build never bundles, so
      # these breakages used to surface only here, one build at a time.
      - name: Verify production JS bundle
        run: npx expo export --platform android --output-dir .bundle-check --clear

      # Build the release APK. Gradle is invoked from the generated `android/`
      # directory. EXPO_PUBLIC_* env vars are inherited from the job-level
      # `env:` block and are embedded into the native build by the Gradle
      # config that `expo prebuild` generated.
      - name: Generate APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_R2_MEDIA_URL: ${{ secrets.EXPO_PUBLIC_R2_MEDIA_URL }}
          EXPO_PUBLIC_MEME_UPLOAD_URL: ${{ secrets.EXPO_PUBLIC_MEME_UPLOAD_URL }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        timeout-minutes: 30

      - name: Verify APK exists
        run: |
          if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK not found at expected path"
            find android -name "*.apk" -type f 2>/dev/null
            exit 1
          fi
          echo "APK verified: $(ls -lh android/app/build/outputs/apk/release/app-release.apk)"

      # Report real size numbers so APK bloat is visible in every run instead
      # of being discovered only when a user complains. The top native
      # libraries are the usual culprit; the marker summary proves R8 and the
      # arm-only ABI split actually took effect.
      - name: Measure APK size
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          echo "=== Total APK size ==="
          ls -lh "$APK"
          bytes=$(stat -c%s "$APK")
          echo "size_bytes=$bytes"
          echo "size_mb=$(awk "BEGIN{printf \"%.2f\", $bytes/1048576}")"
          echo ""
          echo "=== Largest native libraries ==="
          unzip -l "$APK" | grep '\.so$' | awk '{print $1, $4}' | sort -rn | head -15
          echo ""
          echo "=== Verification markers ==="
          unzip -l "$APK" | grep -q 'lib/x86' && echo "FAIL: x86 native libs present (expected arm-only)" && exit 1 || echo "OK: no x86 native libs"
          if unzip -l "$APK" | grep -q 'classes.dex'; then
            echo "dex files present (R8 ran if total dex is small)"
          fi
          # Upload a machine-readable size record as an artifact.
          mkdir -p apk-metrics
          {
            echo "size_bytes=$bytes"
            echo "size_mb=$(awk "BEGIN{printf \"%.2f\", $bytes/1048576}")"
          } > apk-metrics/size.txt
          unzip -l "$APK" | grep '\.so$' | awk '{print $1, $4}' | sort -rn | head -50 > apk-metrics/native-libs.txt

      - name: Upload APK size metrics
        uses: actions/upload-artifact@v4
        with:
          name: APK-size-metrics
          path: apk-metrics/
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BRO-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Push APK to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/upload-apk-blob.mjs android/app/build/outputs/apk/release/app-release.apk
