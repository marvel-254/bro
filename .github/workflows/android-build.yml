name: BRO Android Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Job-level env: all steps can access these values.
# Secrets are read via the `secrets` context and exposed as environment
# variables to the build. Expo embeds EXPO_PUBLIC_* values at build time.
env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_R2_MEDIA_URL: ${{ secrets.EXPO_PUBLIC_R2_MEDIA_URL }}
  EXPO_PUBLIC_MEME_UPLOAD_URL: ${{ secrets.EXPO_PUBLIC_MEME_UPLOAD_URL }}
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          set -euo pipefail

          MISSING=0


          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_URL is not set."
            MISSING=1
          fi

          if [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_ANON_KEY is not set."
            MISSING=1
          fi
          if [ -z "${EXPO_PUBLIC_API_URL:-}" ]; then
            echo "WARN: EXPO_PUBLIC_API_URL is not set. The app will fall back to https://api.bro.app."
          fi

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "FATAL: Required secrets are missing. Aborting build."
            exit 1
          fi

          echo "Secret check passed."
          echo "EXPO_PUBLIC_API_URL is set: $([ -n "${EXPO_PUBLIC_API_URL:-}" ] && echo yes || echo no)"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cache Gradle artifacts keyed on the wrapper properties + lockfile.
      # The `android/` directory is generated by `expo prebuild` and does not
      # exist before the first build, so the restore-keys fallback is required.
      # Gradle otherwise installs the NDK itself mid-build, and that download
      # has failed transiently (a truncated zip). Install it up front from the
      # version React Native actually pins, so a network blip fails here with a
      # clear message instead of midway through compilation.
      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' node_modules/react-native/gradle/libs.versions.toml | head -n1)
          if [ -z "$NDK_VERSION" ]; then
            echo "Could not read ndkVersion from React Native's version catalog"
            exit 1
          fi
          echo "Installing NDK $NDK_VERSION"
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" > /dev/null || true
          "$SDKMANAGER" --list_installed | grep -q "ndk;$NDK_VERSION"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', '**/gradle.lockfile') }}
          restore-keys: |
            gradle-

      # Generate the native Android project from app.json / package.json.
      # `--clean` wipes any stale native config so the build reflects the
      # current Expo config. The `android/` directory is created by this step.
      - name: Prebuild Android
        run: |
          npx expo prebuild --platform android --clean
        timeout-minutes: 30
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_R2_MEDIA_URL: ${{ secrets.EXPO_PUBLIC_R2_MEDIA_URL }}
          EXPO_PUBLIC_MEME_UPLOAD_URL: ${{ secrets.EXPO_PUBLIC_MEME_UPLOAD_URL }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Run Tests
        run: npm test -- --passWithNoTests

      # Fast gate: prove the production JS bundle actually resolves before
      # spending ~12 min on Gradle. This is the check that catches missing
      # runtime deps and bad import paths -- a debug build never bundles, so
      # these breakages used to surface only here, one build at a time.
      - name: Verify production JS bundle
        run: npx expo export --platform android --output-dir .bundle-check --clear

      # Build the release APK. Gradle is invoked from the generated `android/`
      # directory. EXPO_PUBLIC_* env vars are inherited from the job-level
      # `env:` block and are embedded into the native build by the Gradle
      # config that `expo prebuild` generated.
      - name: Generate APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_R2_MEDIA_URL: ${{ secrets.EXPO_PUBLIC_R2_MEDIA_URL }}
          EXPO_PUBLIC_MEME_UPLOAD_URL: ${{ secrets.EXPO_PUBLIC_MEME_UPLOAD_URL }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        timeout-minutes: 30

      # Per-ABI splits mean several APKs land here (arm64-v8a, armeabi-v7a)
      # rather than one universal build, so every step below globs the output
      # directory instead of assuming a single filename.
      - name: Verify APKs exist
        run: |
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK found in android/app/build/outputs/apk/release/"
            find android -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          echo "Found ${#apks[@]} APK(s):"
          ls -lh android/app/build/outputs/apk/release/*.apk

      # Report real size numbers so APK bloat is visible in every run instead
      # of being discovered only when a user complains.
      - name: Measure APK size
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p apk-metrics
          : > apk-metrics/size.txt
          total=0
          for apk in android/app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk")
            bytes=$(stat -c%s "$apk")
            total=$((total + bytes))
            mb=$(awk "BEGIN{printf \"%.2f\", $bytes/1048576}")
            echo "=== $name : $mb MB ==="
            ls -lh "$apk"
            {
              echo "$name $bytes $mb"
            } >> apk-metrics/size.txt
            echo "$name size_bytes=$bytes size_mb=$mb" >> "$GITHUB_STEP_SUMMARY"
            echo "--- largest native libs ---"
            unzip -l "$apk" | grep '\.so$' | awk '{print $1, $4}' | sort -rn | head -8
            echo "--- verification ---"
            if unzip -l "$apk" | grep -q 'lib/x86'; then
              echo "FAIL: x86 native libs present in $name (arm-only expected)"
              exit 1
            fi
            echo "OK: no x86 native libs in $name"
            unzip -l "$apk" | grep '\.so$' | awk '{print $1, $4}' | sort -rn >> apk-metrics/native-libs.txt
          done
          echo ""
          echo "Total across all APKs: $total bytes"

      - name: Upload APK size metrics
        uses: actions/upload-artifact@v4
        with:
          name: APK-size-metrics
          path: apk-metrics/
          retention-days: 30

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: BRO-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Push APK to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          arm64_url=""
          armeabi_url=""
          for apk in android/app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk")
            echo "Uploading $name"
            url=$(node scripts/upload-apk-blob.mjs "$apk")
            echo "  $url"

            # The site's primary button uses this stable alias. ABI splits mean
            # no app-release.apk is produced any more, so without re-uploading
            # it here the URL kept serving a stale pre-split universal build.
            # arm64 covers modern devices; the download page also links the
            # armeabi-v7a APK for older 32-bit hardware.
            if [ "$name" = "app-arm64-v8a-release.apk" ]; then
              echo "Publishing $name as the stable apk/app-release.apk"
              node scripts/upload-apk-blob.mjs "$apk" "apk/app-release.apk"
              arm64_url="$url"
            elif [ "$name" = "app-armeabi-v7a-release.apk" ]; then
              armeabi_url="$url"
            fi
          done

          # The download page reads this pointer, so even a cached HTML page
          # resolves to the build just uploaded instead of an old one.
          node scripts/publish-apk-manifest.mjs "$arm64_url" "$armeabi_url"
