name: BRO CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Job-level env: quality and validate jobs can access these values.
env:
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          set -euo pipefail


          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_URL is not set."
            MISSING=1
          fi

          if [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_ANON_KEY is not set."
            MISSING=1
          fi
          if [ -z "${EXPO_PUBLIC_API_URL:-}" ]; then
            echo "WARN: EXPO_PUBLIC_API_URL is not set. The app will fall back to https://api.bro.app."
          fi

          echo "Secret check passed."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --legacy-peer-deps

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test -- --passWithNoTests

  validate:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --legacy-peer-deps

      - run: npx expo prebuild --no-install --platform android
